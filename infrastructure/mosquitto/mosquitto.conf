# Configuration Mosquitto - Projet Réservoir Intelligent

# Persistance des données/messages
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# --- Listener MQTT standard (utilisé par l'ESP32) ---
listener 1883
allow_anonymous true

# --- Listener WebSocket (utile pour tester depuis un navigateur) ---
listener 9001
protocol websockets
allow_anonymous true